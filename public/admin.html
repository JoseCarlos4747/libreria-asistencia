<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Dueña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .navbar-custom { background-color: #1a1a1a; border-bottom: 3px solid #d4af37; }
        .navbar-brand { color: #d4af37 !important; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-custom mb-4">
        <div class="container-fluid justify-content-between">
            <span class="navbar-brand">Librería Uni - Admin</span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">Salir</button>
        </div>
    </nav>

    <div class="container">
        <h3 class="mb-4 fw-bold text-dark">Panel de Asistencia Diario</h3>
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-center">
                        <thead class="table-dark"><tr><th>Empleado</th><th>Sucursal</th><th>Entrada</th><th>Salida</th><th>Estado</th></tr></thead>
                        <tbody id="tablaDatos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        if (!usuario || usuario.Rol !== 'Administradora') window.location.href = 'login.html';

        async function cargarDatos() {
            const res = await fetch('/api/panel');
            const data = await res.json();
            const tbody = document.getElementById('tablaDatos');
            tbody.innerHTML = '';
            
            data.data.forEach(row => {
                const color = row.EstadoEntrada === 'Tardanza' ? 'text-danger fw-bold' : 'text-success fw-bold';
                const entrada = row.HoraEntrada ? row.HoraEntrada.substring(0, 5) : '--:--';
                const salida = row.HoraSalida ? row.HoraSalida.substring(0, 5) : '--:--';
                tbody.innerHTML += `<tr><td class="fw-semibold">${row.NombreCompleto}</td><td>${row.Sucursal}</td><td>${entrada}</td><td>${salida}</td><td class="${color}">${row.EstadoEntrada}</td></tr>`;
            });
        }
        
        function logout() { localStorage.removeItem('usuario'); window.location.href = 'login.html'; }
        cargarDatos();
        setInterval(cargarDatos, 30000); // Actualiza cada 30 seg
    </script>
</body>
</html>
