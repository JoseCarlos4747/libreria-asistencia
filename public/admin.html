<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Dueña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand">Librería Uni - Administración</span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">Salir</button>
        </div>
    </nav>
    <div class="container">
        <h3 class="mb-4">Panel de Asistencia Diario</h3>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Empleado</th>
                            <th>Sucursal</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaDatos">
                        <!-- Se llena con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        if (!usuario || usuario.Rol !== 'Administradora') window.location.href = 'login.html';

        async function cargarDatos() {
            const res = await fetch('/api/panel');
            const data = await res.json();
            const tbody = document.getElementById('tablaDatos');
            tbody.innerHTML = '';
            
            data.data.forEach(row => {
                // Color rojo si hay tardanza
                const color = row.EstadoEntrada === 'Tardanza' ? 'text-danger fw-bold' : 'text-success';
                tbody.innerHTML += `
                    <tr>
                        <td>${row.NombreCompleto}</td>
                        <td>${row.Sucursal}</td>
                        <td>${row.HoraEntrada || '--:--'}</td>
                        <td>${row.HoraSalida || '--:--'}</td>
                        <td class="${color}">${row.EstadoEntrada || 'Sin registro'}</td>
                    </tr>
                `;
            });
        }
        
        function logout() {
            localStorage.removeItem('usuario');
            window.location.href = 'login.html';
        }

        cargarDatos();
    </script>
</body>
</html>
