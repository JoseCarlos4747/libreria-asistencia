<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../public/styles.css">
</head>
<body class="bg-light">
    <!-- Navbar oscuro con letras doradas -->
    <nav class="navbar navbar-dark navbar-custom mb-4">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1">Librería Uni</span>
        </div>
    </nav>

    <div class="container text-center">
        <h4 id="nombreUsuario" class="mb-4 fw-bold" style="color: var(--azul-principal);">Cargando...</h4>
        
        <div class="card shadow-lg border-0 mx-auto" style="max-width: 400px; border-radius: 15px;">
            <div class="card-body p-4">
                <h5 class="text-muted mb-4">Mi Asistencia de Hoy</h5>
                <div class="d-grid gap-3">
                    <!-- Botones grandes y claros -->
                    <button onclick="marcar('entrada')" class="btn btn-success btn-lg p-4 fw-bold shadow-sm" style="border-radius: 10px;">MARCAR ENTRADA</button>
                    <button onclick="marcar('salida')" class="btn btn-danger btn-lg p-4 fw-bold shadow-sm" style="border-radius: 10px;">MARCAR SALIDA</button>
                </div>
                <div id="mensaje" class="mt-4"></div>
            </div>
        </div>
        
        <button onclick="logout()" class="btn btn-outline-dark mt-4 btn-sm">Cerrar Sesión</button>
    </div>

    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        if (!usuario || usuario.Rol !== 'Empleado') window.location.href = 'login.html';
        document.getElementById('nombreUsuario').innerText = `Hola, ${usuario.NombreCompleto}`;

        async function marcar(tipo) {
            const res = await fetch(`/api/${tipo}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    usuarioID: usuario.UsuarioID, 
                    sucursalID: usuario.SucursalID,
                    modoDemo: true 
                })
            });
            const data = await res.json();
            if(data.ok) {
                document.getElementById('mensaje').innerHTML = `
                    <div class="alert alert-success fw-bold">
                        ${data.mensaje}<br>
                        Hora: ${data.hora}<br>
                        Estado: ${data.estado}
                    </div>`;
            } else {
                document.getElementById('mensaje').innerHTML = `<div class="alert alert-danger fw-bold">Error: ${data.error}</div>`;
            }
        }

        function logout() {
            localStorage.removeItem('usuario');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
