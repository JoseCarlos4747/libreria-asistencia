<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Empleado</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5 text-center">
        <h4 id="nombreUsuario" class="mb-4">Cargando...</h4>
        
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="text-muted mb-4">Mi Asistencia de Hoy</h5>
                <div class="d-grid gap-3">
                    <button onclick="marcar('entrada')" class="btn btn-success btn-lg p-4">📥 MARCAR ENTRADA</button>
                    <button onclick="marcar('salida')" class="btn btn-danger btn-lg p-4">📤 MARCAR SALIDA</button>
                </div>
                <div id="mensaje" class="mt-4 fw-bold"></div>
            </div>
        </div>
        <button onclick="logout()" class="btn btn-outline-secondary btn-sm">Cerrar Sesión</button>
    </div>

    <script>
    const usuario = JSON.parse(localStorage.getItem('usuario'));
    if (!usuario || usuario.Rol !== 'Empleado') window.location.href = 'login.html';
    document.getElementById('nombreUsuario').innerText = `Hola, ${usuario.NombreCompleto}`;

    async function marcar(tipo) {
        // modoDemo: true fuerza a que el servidor simule la hora correcta
        const res = await fetch(`/api/${tipo}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                usuarioID: usuario.UsuarioID, 
                sucursalID: usuario.SucursalID,
                modoDemo: true // <--- ESTO ES LA MAGIA PARA TU PRESENTACIÓN
            })
        });
        const data = await res.json();
        if(data.ok) {
            document.getElementById('mensaje').innerHTML = `
                <div class="alert alert-info">
                    <strong>${data.mensaje}</strong><br>
                    Hora: ${data.hora}<br>
                    Estado: <span class="badge bg-${data.estado === 'Puntual' || data.estado === 'Normal' ? 'success' : 'danger'}">${data.estado}</span>
                </div>`;
        } else {
            document.getElementById('mensaje').innerHTML = `<div class="alert alert-danger">Error: ${data.error}</div>`;
        }
    }

    function logout() {
        localStorage.removeItem('usuario');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
