<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería Uni - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="d-flex align-items-center" style="height: 100vh; background-color: var(--negro);">
    <div class="container">
        <div class="card shadow-lg border-0" style="border-radius: 15px;">
            <div class="card-body p-5 text-center">
                <!-- Título con color dorado -->
                <h2 class="mb-4 fw-bold" style="color: var(--dorado);">Librería Uni</h2>
                <p class="text-muted mb-4">Ingresa tu correo para marcar asistencia</p>
                
                <input type="email" id="correo" class="form-control form-control-lg mb-4" placeholder="ejemplo@gmail.com" style="border: 2px solid var(--azul-principal);">
                
                <button onclick="login()" class="btn btn-primary-custom btn-lg w-100 mb-3">Ingresar</button>
                
                <div id="error" class="text-danger small fw-bold"></div>
            </div>
        </div>
    </div>
    <script>
        async function login() {
            const correo = document.getElementById('correo').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo })
            });
            const data = await res.json();
            if (data.ok) {
                localStorage.setItem('usuario', JSON.stringify(data.usuario));
                if (data.usuario.Rol === 'Administradora') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'empleado.html';
                }
            } else {
                document.getElementById('error').innerText = data.error;
            }
        }
    </script>
</body>
</html>
