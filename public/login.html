<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería Uni - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h3 class="mb-4">Librería Uni</h3>
                <p class="text-muted">Ingresa tu correo para marcar asistencia</p>
                <input type="email" id="correo" class="form-control mb-3" placeholder="ejemplo@gmail.com">
                <button onclick="login()" class="btn btn-primary w-100">Ingresar</button>
                <div id="error" class="text-danger mt-3 small"></div>
            </div>
        </div>
    </div>
    <script>
        async function login() {
            const correo = document.getElementById('correo').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo })
            });
            const data = await res.json();
            if (data.ok) {
                localStorage.setItem('usuario', JSON.stringify(data.usuario));
                if (data.usuario.Rol === 'Administradora') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'empleado.html';
                }
            } else {
                document.getElementById('error').innerText = data.error;
            }
        }
    </script>
</body>
</html>
