<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería Uni - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Colores directos aquí para que no fallen */
        body {
            background-color: #1a1a1a !important; /* Negro */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: none;
        }
        .titulo-dorado {
            color: #d4af37 !important; /* Dorado */
            font-weight: bold;
        }
        .btn-azul {
            background-color: #0d3b66 !important; /* Azul */
            color: white !important;
            border: none;
            transition: 0.3s;
        }
        .btn-azul:hover {
            background-color: #092a4a !important;
        }
        .input-custom {
            border: 2px solid #0d3b66 !important;
        }
    </style>
</head>
<body class="d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="card card-custom mx-auto" style="max-width: 400px;">
            <div class="card-body p-5 text-center">
                
                <h2 class="mb-4 titulo-dorado">Librería Uni</h2>
                <p class="text-muted mb-4">Ingresa tu correo para marcar asistencia</p>
                
                <input type="email" id="correo" class="form-control form-control-lg mb-4 input-custom" placeholder="ejemplo@gmail.com">
                
                <button onclick="login()" class="btn btn-azul btn-lg w-100 mb-3">Ingresar</button>
                
                <div id="error" class="text-danger small fw-bold"></div>
            </div>
        </div>
    </div>
    <script>
        async function login() {
            const correo = document.getElementById('correo').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo })
            });
            const data = await res.json();
            if (data.ok) {
                localStorage.setItem('usuario', JSON.stringify(data.usuario));
                if (data.usuario.Rol === 'Administradora') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'empleado.html';
                }
            } else {
                document.getElementById('error').innerText = data.error;
            }
        }
    </script>
</body>
</html>
